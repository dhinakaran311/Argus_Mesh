version: "3.9"

# =============================================================================
# AbuseRing Sentinel — Docker Compose (Local Development)
# =============================================================================
# ALL databases are cloud-hosted (Supabase, Qdrant, Neo4j Aura).
# This file runs the backend and frontend services locally,
# connecting them to the cloud databases via .env credentials.
#
# Usage:
#   cp .env.example .env        ← fill in your cloud credentials
#   docker compose up           ← starts backend + frontend
#
# Prerequisites:
#   - Docker Desktop installed
#   - .env file filled with real cloud credentials
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Backend — FastAPI (Python 3.11)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abusering-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - ./backend:/app
      - ./ml/models:/app/ml_models:ro   # model artifacts (read-only)
      - ./data:/app/data:ro             # data files (read-only)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend — Next.js 14 (TypeScript)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: abusering-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules          # preserve container node_modules
      - /app/.next                 # preserve Next.js build cache
    command: npm run dev
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: abusering-network
